# AUTHENTIK auth provider

services:
  postgresql:
    env_file:
    - .env
    environment:
      POSTGRES_DB: ${PG_DB:-authentik}
      POSTGRES_PASSWORD: ${PG_PASS:?database password required}
      POSTGRES_USER: ${PG_USER:-authentik}
    healthcheck:
      interval: 30s
      retries: 5
      start_period: 20s
      test:
      - CMD-SHELL
      - pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}
      timeout: 5s
    image: docker.io/library/postgres:16-alpine
    networks:
      - authentik
    restart: unless-stopped
    volumes:
    - $CONFIG_PATH/database:/var/lib/postgresql/data

  redis:
    command: --save 60 1 --loglevel warning
    healthcheck:
      interval: 30s
      retries: 5
      start_period: 20s
      test:
      - CMD-SHELL
      - redis-cli ping | grep PONG
      timeout: 3s
    image: docker.io/library/redis:alpine
    networks:
      - authentik
    restart: unless-stopped
    volumes:
    - redis:/data

  server:
    container_name: authentik
    command: server
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
    - .env
    environment:
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
      AUTHENTIK_POSTGRESQL__HOST: postgresql
      AUTHENTIK_POSTGRESQL__NAME: ${PG_DB:-authentik}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${PG_PASS}
      AUTHENTIK_POSTGRESQL__USER: ${PG_USER:-authentik}
      AUTHENTIK_REDIS__HOST: redis
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?secret key required}
    image: ${AUTHENTIK_IMAGE:-ghcr.io/goauthentik/server}:${AUTHENTIK_TAG:-2025.8.1}
    networks:
      - authentik
      - outpost
    # Loopback only: reachable only through Caddy on this host, never directly from the LAN.
    # The embedded outpost is proxied by Caddy, so nothing else needs to reach these ports.
    ports:
    - "127.0.0.1:${COMPOSE_PORT_HTTP:-9000}:9000"
    - "127.0.0.1:${COMPOSE_PORT_HTTPS:-9443}:9443"
    restart: unless-stopped
    volumes:
    - $CONFIG_PATH/media:/media
    - $CONFIG_PATH/custom-templates:/templates

  worker:
    command: worker
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
    - .env
    environment:
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
      AUTHENTIK_POSTGRESQL__HOST: postgresql
      AUTHENTIK_POSTGRESQL__NAME: ${PG_DB:-authentik}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${PG_PASS}
      AUTHENTIK_POSTGRESQL__USER: ${PG_USER:-authentik}
      AUTHENTIK_REDIS__HOST: redis
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?secret key required}
    image: ${AUTHENTIK_IMAGE:-ghcr.io/goauthentik/server}:${AUTHENTIK_TAG:-2025.8.1}
    networks:
      - authentik
    restart: unless-stopped
    # The Docker socket is deliberately NOT mounted here. This deployment uses Authentik's
    # embedded outpost, which runs in-process and needs no socket. The worker never manages
    # other containers, so a socket mount would only add a container-escape path for nothing.
    volumes:
    - $CONFIG_PATH/media:/media
    - $CONFIG_PATH/certs:/certs
    - $CONFIG_PATH/custom-templates:/templates

networks:
  outpost:
    name: outpost
    external: true
  authentik:
    name: authentik

volumes:
  redis:
    driver: local
