# Pre-commit hooks for outpost.
#
# Install once with: pre-commit install
# Run against everything with: pre-commit run --all-files
#
# Tool requirements of each hook:
#   gitleaks   : built from source by pre-commit, so a Go toolchain is needed
#   hadolint   : expects hadolint on PATH (the "hadolint" hook, not the docker variant)
#   shellcheck : runs the koalaman/shellcheck container image, so docker is needed
#   just-check : runs `just check`, which needs just plus the docker CLI and compose plugin
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        name: gitleaks (staged secret scan)

  - repo: https://github.com/hadolint/hadolint
    rev: v2.15.1
    hooks:
      - id: hadolint
        name: hadolint (proxy Dockerfile)
        files: ^00_proxy/Dockerfile$

  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.11.0
    hooks:
      - id: shellcheck
        name: shellcheck (shell scripts)
        types: [shell]

  - repo: local
    hooks:
      - id: just-check
        name: just check (compose config, linters, secrets)
        entry: just check
        language: system
        pass_filenames: false
        always_run: true
