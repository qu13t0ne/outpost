#  Speedtest-Tracker (Speedtest-tracker.dev)
services:
  speedtest-tracker:
    container_name: $CONTAINER_NAME
    image: lscr.io/linuxserver/speedtest-tracker:latest
    restart: unless-stopped # "no" always on-failure unless-stopped
    ports:
    # Bound to the host LAN address so only Caddy can reach it. Never 0.0.0.0.
    - "${BIND_ADDR}:${PORT}:80"
    env_file: .env
    environment:
    - DB_CONNECTION=sqlite
    # true is for temporary debugging only: it exposes stack traces and config in the UI.
    - APP_DEBUG=false
    # - APP_KEY=$APP_KEY
    # - APP_NAME=$APP_NAME
    # - APP_URL=$FQDN
    # - ASSET_URL=$FQDN
    # - DISPLAY_TIMEZONE=$DISPLAY_TIMEZONE
    volumes:
    - $CONFIG_PATH/:/config
