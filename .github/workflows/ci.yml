name: CI

# Validate every compose file against its env template and scan for secrets.
# No repository secrets or credentials are required.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  compose-config:
    name: Compose config
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Validate every compose file against its env template
        run: |
          set -uo pipefail
          fail=0
          # Mirror the `check` recipe in the justfile. Only deployable services are validated;
          # x_archive/ (retired), template/ (a scaffold) and config.example/ (the source tree)
          # are excluded. The compose files reach their env and mount paths through
          # OUTPOST_CONFIG_DIR, so a throwaway copy of config.example/ is fed to them; the real
          # config directory is never read from or written into the repository.
          if ! tracked_compose=$(git ls-files -- '**/docker-compose.yml' 2>/dev/null); then
            echo "FAIL: git ls-files failed; run inside the repository checkout"
            exit 1
          fi
          services() {
            printf '%s\n' "$tracked_compose" | grep -vE '(^|/)(x_archive|template|config.example)/' | sort
          }
          if [ -z "$(services)" ]; then
            echo "FAIL: no tracked compose files found to check"
            exit 1
          fi
          if [ ! -d config.example ] || [ -z "$(find config.example -type f 2>/dev/null)" ]; then
            echo "FAIL config.example/ is missing or empty"
            exit 1
          fi

          # The temp tree mirrors the repository layout, so relative references such as
          # `extends: {file: ../compose.common.yml}` still resolve, and compose is run from inside
          # the mirror, never the real service directory.
          tmp=$(mktemp -d)
          cfg="$tmp/cfg"
          cp -R config.example/. "$cfg"
          mkdir -p "$tmp/root"
          [ -f compose.common.yml ] && cp compose.common.yml "$tmp/root/"
          export OUTPOST_CONFIG_DIR="$cfg"

          while IFS= read -r compose; do
            dir=$(dirname "$compose"); dir=${dir#./}
            mkdir -p "$tmp/root/$dir"
            cp "$dir/docker-compose.yml" "$tmp/root/$dir/"
            [ -f "$dir/docker-compose.override.yml" ] && cp "$dir/docker-compose.override.yml" "$tmp/root/$dir/"
            envfiles=( --env-file "$cfg/outpost.env" )
            [ -f "$cfg/$dir/compose.env" ] && envfiles+=( --env-file "$cfg/$dir/compose.env" )
            echo "== $dir"
            if ( cd "$tmp/root/$dir" && docker compose "${envfiles[@]}" config -q ); then
              echo "ok   $dir"
            else
              echo "FAIL $dir"
              fail=1
            fi
          done < <(services)

          rm -rf "$tmp"
          exit "$fail"

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install gitleaks
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSfL "${base}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks

      # Working tree only. Scanning full history is a follow-up task: it needs a
      # separate run with fetch-depth 0 and a decision on pre-existing findings.
      - name: Scan the working tree for secrets
        run: ./gitleaks detect --no-git --redact --verbose
