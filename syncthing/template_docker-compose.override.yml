# Per-server Syncthing settings. Copy to docker-compose.override.yml (gitignored) and edit.
# Docker Compose merges this file into docker-compose.yml automatically.
# Only set what differs from the base defaults.
services:
  syncthing:
    # ---- Overrides (merged by variable name; omit to keep base default) ---
    # environment:
    #   - PUID=1000                # `id -u` of the sync folder owner; 33 for Nextcloud AIO (see readme)
    #   - PGID=1000                # `id -g` of the sync folder owner; 33 for Nextcloud AIO
    #   - TZ=America/New_York

    # ---- Sync folders (merged by container path; /config replaces base) ---
    volumes:
      # Config dir (base default is ./conf):
      # - /path/to/syncthing/conf:/config
      #
      # Generic host directory:
      - /path/on/host:/data/foldername
      #
      # Nextcloud AIO user data (see readme for PUID requirements):
      # - /path/to/nextcloud/data/ncdata:/data/nextcloud
      #
      # External NAS mount (see readme; host mount must be active first):
      # - /mnt/mynas:/data/mynas

    # ---- Host network mode (optional; see readme "Network Mode") --------
    # The base file publishes the sync ports on ${TAILSCALE_ADDR} and the web UI on
    # ${BIND_ADDR}, and joins no Docker network. Uncomment the two lines below to let the
    # host stack govern reachability instead: Syncthing then listens on the host directly
    # and publishes nothing.
    # network_mode: host
    # ports: !reset []

    # ---- Reverse proxy ------------------------------------------------
    # The web UI (8384) is published by the base file on ${BIND_ADDR}, which is what Caddy on
    # server1 proxies. If the host stack owns reachability instead (host mode above), the
    # host firewall must allow TCP 8384 from the proxy host and nothing else.
