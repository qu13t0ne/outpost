# SYNCTHING
services:
  syncthing:
    image: lscr.io/linuxserver/syncthing:latest
    container_name: $CONTAINER_NAME
    restart: unless-stopped
    environment:
      - PUID=$PUID
      - PGID=$PGID
      - TZ=$TZ
    ports:
      # Web UI port 8384 is NOT published when Caddy runs on the same host
      # (it reaches Syncthing via the shared Docker network by container name).
      # If Caddy runs on a DIFFERENT host, uncomment the line below and
      # restrict access with a host firewall to the Caddy host IP only.
      # - 8384:8384
      - 22000:22000/tcp # sync traffic (TCP)
      - 22000:22000/udp # sync traffic (QUIC)
      - 21027:21027/udp # local device discovery
    volumes:
      - $CONFIG_PATH:/config
      # ---- Sync folders -----------------------------------------------
      # Generic host directory example:
      # - /path/on/host:/data/foldername
      #
      # Nextcloud AIO user data (see readme for PUID requirements):
      # - $NEXTCLOUD_DATADIR/ncdata:/data/nextcloud
      #
      # External NAS mount (see readme; host mount must be active first):
      # - /mnt/mynas:/data/mynas
    networks:
      - outpost

networks:
  outpost:
    name: outpost
    external: true
