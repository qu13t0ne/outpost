services:

  caddy:
    # image: caddy:2
    build: .
    container_name: caddy
    restart: always
    ports:
      # - "${BIND_ADDR}:80:80"
      # Bound to the host LAN address, not 0.0.0.0: the single LAN ingress is Caddy on 443.
      - "${BIND_ADDR}:443:443"
      # The tailnet listener. With no subnet router, the LAN address is unroutable from a
      # tailnet-only device, so this second address is what gives the overlay a way in.
      # Two addresses and no wildcard: that is the whole bind rule.
      - "${TAILSCALE_ADDR}:443:443"
    environment:
      - EMAIL_FOR_ACME
      - CF_API_TOKEN
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${APPDATA}/caddy/data:/data
      - ${APPDATA}/caddy/config:/config
      - ./static:/static:ro
    networks:
      - outpost

  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token $TUNNEL_TOKEN
    container_name: tunnel
    environment:
      - TUNNEL_TOKEN
    restart: always
    networks:
      - outpost

networks:
  outpost:
    name: outpost
    external: true
